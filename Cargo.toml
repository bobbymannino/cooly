[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
cooly-api = { path = "crates/api" }
cooly-store = { path = "crates/store" }
cooly-ui = { path = "crates/ui" }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
directories = "6.0"
gpui-kit = "0.7.3"
keyring = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
ureq = { version = "3.4", features = ["json", "platform-verifier"] }
url = "2.5"
zeroize = "1.8"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
